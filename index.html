<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>지예 작업 현황</title>
  <meta name="description" content="스톡·이모티콘·프린터블 부업 진행 상황을 플랫폼별로 한눈에 보는 작업판" />
  <meta name="theme-color" content="#3D3A6B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="작업 현황" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/favicon-64.png" sizes="64x64" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <p class="eyebrow">작업 현황판</p>
          <h1 id="app-title">지예 작업 현황</h1>
        </div>
        <button id="refresh" class="refresh" type="button" aria-label="새로 고침">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" /></svg>
        </button>
      </div>
      <p class="updated"><span id="updated-at">불러오는 중…</span><span id="net-state" class="net" hidden>오프라인</span></p>

      <div class="stats" id="stats" role="group" aria-label="전체 요약"></div>
    </header>

    <nav class="chips" id="chips" aria-label="상태 필터"></nav>

    <main id="main">
      <section id="home-view" aria-live="polite">
        <p class="section-label" id="platform-label"></p>
        <ul class="platform-list" id="platform-list"></ul>
      </section>

      <section id="detail-view" hidden aria-live="polite">
        <button class="back" id="back" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          플랫폼 전체
        </button>
        <div id="detail-body"></div>
      </section>

      <div class="foot">
        <button class="hidden-toggle" id="hidden-toggle" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.4-6 9-6 9 6 9 6-3.4 6-9 6-9-6-9-6z" /><circle cx="12" cy="12" r="2.6" /></svg>
          숨긴 항목 <span id="hidden-count">0</span>개 보기
        </button>
        <p class="foot-note">data/works.json 만 고치면 앱에 바로 반영됩니다.</p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-text" id="toast-text"></span>
    <button class="toast-action" id="toast-action" type="button" hidden>실행 취소</button>
  </div>

  <div class="sheet" id="hidden-sheet" role="dialog" aria-modal="true" aria-labelledby="hidden-title" hidden>
    <div class="sheet-backdrop" id="hidden-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="hidden-title">숨긴 항목</h2>
        <button class="sheet-close" id="hidden-close" type="button" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <p class="sheet-desc">숨긴 항목은 목록·요약 숫자·플랫폼 진행률에서 빠집니다. 원본 <code>data/works.json</code>에서 지우려면 <b>숨긴 목록 복사</b>를 눌러 저에게 붙여넣어 주세요.</p>
      <ul class="hidden-list" id="hidden-list"></ul>
      <div class="sheet-foot">
        <button class="btn-ghost" id="hidden-copy" type="button">숨긴 목록 복사</button>
        <button class="btn-ghost danger" id="hidden-restore-all" type="button">전체 복원</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
